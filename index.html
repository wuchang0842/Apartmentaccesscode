<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101729">
<title>Apartment Access Codes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#172033;background:#f4f5f7}
body{margin:0;background:#f4f5f7}
.hero{background:#101729;color:white;padding:28px 26px 26px;border-radius:0 0 0 0}
.hero h1{font-size:28px;line-height:1.1;margin:0 0 12px;font-weight:800;letter-spacing:-.8px}
.hero p{font-size:16px;color:#b9c0cf;margin:0 0 24px}
.hero-actions{display:grid;grid-template-columns:1fr 130px;gap:12px}
.hero button{border:0;border-radius:17px;padding:16px 12px;font-size:16px;font-weight:750;cursor:pointer}
#findBtn{background:#fff;color:#182033}
#mapBtn{background:#344056;color:#fff}
main{padding:32px 20px 40px;max-width:1100px;margin:auto}
.notice{background:#fff7eb;color:#98482e;border-radius:18px;padding:18px;margin-bottom:14px;font-size:16px;line-height:1.35}
.search-wrap{position:relative;z-index:5000}
#search{width:100%;border:2px solid #dedfe3;border-radius:19px;padding:17px 20px;font-size:20px;background:white;color:#172033;outline:none;box-shadow:0 1px 2px #00000005}
#search:focus{border-color:#8da7df}
#suggestions{display:none;position:absolute;left:0;right:0;top:62px;background:white;border:1px solid #dfe2e8;border-radius:0 0 18px 18px;box-shadow:0 12px 30px #17203324;overflow:hidden;z-index:6000}
.suggestion{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf0f4;background:white;padding:13px 17px;color:#172033;cursor:pointer;font-size:14px}
.suggestion:last-child{border-bottom:0}
.suggestion small{display:block;color:#4c946f;font-weight:750;margin-top:4px}
.summary{font-size:20px;color:#687080;margin:28px 3px 24px}
#map{height:420px;border-radius:20px;overflow:hidden;border:1px solid #d9dde5;background:#dfe4eb;position:relative;z-index:1}
.map-note{font-size:12px;color:#7a8290;margin:9px 2px 20px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border:1px solid #e1e4ea;border-radius:17px;padding:15px;box-shadow:0 2px 6px #1720330a}
.area{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:#6e8a75;margin-bottom:5px}
.address{font-size:16px;font-weight:800;line-height:1.35;margin:0;color:#172033}
.codes{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px}
.code{background:#edf7ef;color:#22643c;border-radius:9px;padding:7px 9px;font-size:14px;font-weight:800;overflow-wrap:anywhere}
.distance{font-size:12px;color:#7a8290;margin-top:10px}
.empty{grid-column:1/-1;text-align:center;background:white;border-radius:16px;padding:35px;color:#7a8290}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:white;color:#172033}
.popup-title{font-weight:800;font-size:13px;margin-bottom:5px}
.popup-code{color:#22643c;font-weight:800;margin:2px 0}
@media(max-width:600px){
 .hero{padding:30px 26px 26px}
 .hero h1{font-size:28px}
 .hero-actions{grid-template-columns:1fr 114px}
 main{padding:32px 20px 30px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{padding:12px;border-radius:15px}
 .address{font-size:13px}
 .code{font-size:12px;padding:6px 7px}
 #map{height:430px}
}
@media(max-width:370px){
 .hero h1{font-size:24px}
 .hero-actions{grid-template-columns:1fr 100px}
 .cards{gap:7px}
}
</style>
</head>
<body>
<header class="hero">
  <h1>🏢 Apartment Access Codes</h1>
  <p>Brunswick &amp; Brunswick East · tap an address to reveal the code</p>
  <div class="hero-actions">
    <button id="findBtn">📍 Find nearby</button>
    <button id="mapBtn">🗺️ Map</button>
  </div>
</header>
<main>
  <div class="notice">Access codes are sensitive. Share this page only with trusted colleagues.</div>
  <div class="search-wrap">
    <input id="search" type="search" autocomplete="off" placeholder="Search address or code…">
    <div id="suggestions"></div>
  </div>
  <div class="summary"><span id="count">40</span> apartments</div>
  <div id="map"></div>
  <div class="map-note">Map shows all available locations. Tap a marker to see its access code.</div>
  <section class="cards" id="cards"></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const APARTMENTS=[{"area": "Brunswick", "address": "10 Donald Street, Brunswick VIC", "codes": ["2511"]}, {"area": "Brunswick", "address": "10 Pottery Court, Brunswick VIC", "codes": ["6415"]}, {"area": "Brunswick", "address": "100 Blyth Street, Brunswick VIC", "codes": ["2789"]}, {"area": "Brunswick", "address": "12-32 Lux Way, Brunswick VIC", "codes": ["Key2306"]}, {"area": "Brunswick", "address": "15 Showers Street, Brunswick VIC", "codes": ["#201001#"]}, {"area": "Brunswick", "address": "2-6 Duckett Street, Brunswick VIC", "codes": ["#2680#"]}, {"area": "Brunswick", "address": "2 Black Street, Brunswick VIC", "codes": ["Bell8116bell"]}, {"area": "Brunswick", "address": "212 Albion Street, Brunswick VIC", "codes": ["742579#"]}, {"area": "Brunswick", "address": "285 Brunswick Road, Brunswick VIC", "codes": ["14580"]}, {"area": "Brunswick", "address": "287 Brunswick Road, Brunswick VIC", "codes": ["#1206", "#2613"]}, {"area": "Brunswick", "address": "394 Lygon Street, Brunswick VIC", "codes": ["#3944#"]}, {"area": "Brunswick", "address": "40-52 Percy Street, Brunswick VIC", "codes": ["key0491"]}, {"area": "Brunswick", "address": "4 Saxon Street, Brunswick VIC", "codes": ["2608"]}, {"area": "Brunswick", "address": "54-84 Percy Street, Brunswick VIC", "codes": ["key9184"]}, {"area": "Brunswick", "address": "55 De Carle Street, Brunswick VIC", "codes": ["3579"]}, {"area": "Brunswick", "address": "553 Murray Road, Brunswick VIC", "codes": ["5300"]}, {"area": "Brunswick", "address": "6 Black Street, Brunswick VIC", "codes": ["8047#"]}, {"area": "Brunswick", "address": "690 High Street, Brunswick VIC", "codes": ["1937"]}, {"area": "Brunswick", "address": "7 Colebrook Street, Brunswick VIC", "codes": ["key2105"]}, {"area": "Brunswick", "address": "74 De Carle Street, Brunswick VIC", "codes": ["o,0852"]}, {"area": "Brunswick", "address": "767 High Street, Brunswick VIC", "codes": ["#2204"]}, {"area": "Brunswick", "address": "8-38 Percy Street, Brunswick VIC", "codes": ["key2794"]}, {"area": "Brunswick", "address": "98 Moreland Road, Brunswick VIC", "codes": ["C2389Z"]}, {"area": "Brunswick East", "address": "116 Albert Street, Brunswick East VIC", "codes": ["#1874#"]}, {"area": "Brunswick East", "address": "133 Nicholson Street, Brunswick East VIC", "codes": ["#1111"]}, {"area": "Brunswick East", "address": "162-164 Lygon Street, Brunswick East VIC", "codes": ["483164"]}, {"area": "Brunswick East", "address": "240-250 Lygon Street, Brunswick East VIC", "codes": ["#888888#"]}, {"area": "Brunswick East", "address": "269 Stewart Street, Brunswick East VIC", "codes": ["#269269"]}, {"area": "Brunswick East", "address": "38 Hutchinson Street, Brunswick East VIC", "codes": ["22106"]}, {"area": "Brunswick East", "address": "455 Lygon Street, Brunswick East VIC", "codes": ["#9648"]}, {"area": "Brunswick East", "address": "791-793 Park Street, Brunswick East VIC", "codes": ["5690"]}, {"area": "Brunswick East", "address": "9 Holmes Street, Brunswick East VIC", "codes": ["2580"]}, {"area": "Brunswick West", "address": "14 Irvine Crescent, Brunswick West VIC", "codes": ["C289"]}, {"area": "Coburg", "address": "15-17 De Carle Street, Coburg VIC", "codes": ["313313#"]}, {"area": "Coburg", "address": "183 Moreland Road, Brunswick VIC", "codes": ["1956#"]}, {"area": "Coburg", "address": "23 Baxter Street, Coburg VIC", "codes": ["C7625 sml gate"]}, {"area": "Coburg", "address": "37-41 Munro Street, Coburg VIC", "codes": ["#3204"]}, {"area": "Coburg", "address": "5 Industry Lane, Coburg VIC", "codes": [".8503"]}, {"area": "Coburg", "address": "56 Sydney Road, Coburg VIC", "codes": ["8895"]}, {"area": "Coburg", "address": "6 Industry Lane, Coburg VIC", "codes": [".8503"]}];
const centers={
  "Brunswick":[-37.7676,144.9588],
  "Brunswick East":[-37.7660,144.9790],
  "Brunswick West":[-37.7640,144.9430],
  "Coburg":[-37.7420,144.9630]
};
let user=null, mapVisible=true, userMarker=null;
const map=L.map('map',{zoomControl:true}).setView([-37.765,144.965],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const markers=L.layerGroup().addTo(map);
const $=id=>document.getElementById(id);
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function km(a,b,c,d){const R=6371,p=Math.PI/180,x=.5-Math.cos((c-a)*p)/2+Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;return 2*R*Math.asin(Math.sqrt(x))}
function fmt(k){return k==null?'':k<1?Math.round(k*1000)+' m':k.toFixed(1)+' km'}
function searchable(a){return (a.area+' '+a.address+' '+a.codes.join(' ')).toLowerCase()}
function render() {
 const q=$('search').value.trim().toLowerCase();
 let list=APARTMENTS.filter(a=>searchable(a).includes(q));
 if(user) list.sort((a,b)=>(a.distance??99999)-(b.distance??99999));
 $('count').textContent=list.length;
 $('cards').innerHTML='';
 if(!list.length){$('cards').innerHTML='<div class="empty">No matching apartments found.</div>';return}
 list.forEach(a=>{
   const card=document.createElement('article');card.className='card';
   card.innerHTML='<div class="area">'+esc(a.area)+'</div><h2 class="address">'+esc(a.address)+'</h2><div class="codes">'+a.codes.map(c=>'<span class="code">'+esc(c)+'</span>').join('')+'</div>'+(a.distance!=null?'<div class="distance">'+fmt(a.distance)+' away</div>':'');
   card.onclick=()=>focusApartment(a);
   $('cards').appendChild(card);
 });
}
function focusApartment(a){
 if(a.lat==null) return;
 map.setView([a.lat,a.lng],16);
 markers.eachLayer(m=>{if(m._apt===a)m.openPopup()});
}
function popup(a){return '<div class="popup-title">'+esc(a.address)+'</div>'+a.codes.map(c=>'<div class="popup-code">'+esc(c)+'</div>').join('')}
function drawMarkers(){
 markers.clearLayers();
 const bounds=[];
 APARTMENTS.forEach(a=>{
   const c=centers[a.area]||[-37.765,144.965];
   const lat=a.lat??(c[0]+(Math.random()-.5)*.035);
   const lng=a.lng??(c[1]+(Math.random()-.5)*.045);
   a.lat=lat;a.lng=lng;
   const m=L.marker([lat,lng]).addTo(markers).bindPopup(popup(a));
   m._apt=a;
   bounds.push([lat,lng]);
 });
 if(bounds.length&&!user)map.fitBounds(bounds,{padding:[22,22]});
}
function suggestions(){
 const q=$('search').value.trim().toLowerCase(),box=$('suggestions');
 if(!q){box.style.display='none';box.innerHTML='';return}
 const list=APARTMENTS.filter(a=>searchable(a).includes(q)).slice(0,8);
 box.innerHTML=list.map(a=>'<button class="suggestion" data-address="'+esc(a.address)+'">'+esc(a.address)+'<small>'+esc(a.codes.join(' · '))+'</small></button>').join('');
 box.style.display=list.length?'block':'none';
 box.querySelectorAll('button').forEach(b=>b.onclick=()=>{$('search').value=b.dataset.address;box.style.display='none';render()});
}
async function improveCoordinates(){
 $('status') && ($('status').textContent='Checking exact map locations…');
 let found=0;
 for(const a of APARTMENTS){
   try{
     const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=au&q='+encodeURIComponent(a.address),{headers:{'Accept-Language':'en'}});
     const d=await r.json();
     if(d[0]){
       a.lat=Number(d[0].lat);
       a.lng=Number(d[0].lon);
       found++;
       drawMarkers();
     }
     await new Promise(r=>setTimeout(r,1100));
   }catch(e){
     console.warn('Geocoding failed:',a.address,e);
   }
 }
 drawMarkers();
 $('status').textContent=found+' exact map locations found · '+APARTMENTS.length+' apartments';
}
function locate(){
 if(!navigator.geolocation){alert('Location is not supported by this browser.');return}
 $('findBtn').textContent='📍 Locating…';
 navigator.geolocation.getCurrentPosition(p=>{
   user={lat:p.coords.latitude,lng:p.coords.longitude};
   APARTMENTS.forEach(a=>a.distance=km(user.lat,user.lng,a.lat,a.lng));
   if(userMarker)map.removeLayer(userMarker);
   userMarker=L.circleMarker([user.lat,user.lng],{radius:9,color:'#1769d1',fillColor:'#3b91ff',fillOpacity:.9}).addTo(map).bindPopup('You are here');
   map.setView([user.lat,user.lng],14);
   render();$('findBtn').textContent='📍 Nearby first';
 },()=>{$('findBtn').textContent='📍 Find nearby';alert('Please allow location access in your browser settings.')},{enableHighAccuracy:true,timeout:10000});
}
$('search').addEventListener('input',()=>{suggestions();render()});
$('search').addEventListener('focus',suggestions);
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))$('suggestions').style.display='none'});
$('findBtn').onclick=locate;
$('mapBtn').onclick=()=>{mapVisible=!mapVisible;$('map').style.display=mapVisible?'block':'none';$('mapBtn').textContent=mapVisible?'🗺️ Map':'🗺️ Show map';if(mapVisible)setTimeout(()=>map.invalidateSize(),100)};
drawMarkers();render();
improveCoordinates();
</script>
</body>
</html>
