<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>Apartment Access</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;background:#090b0f;color:#f5f7fa}header{position:sticky;top:0;z-index:1000;padding:16px;background:#10141b;border-bottom:1px solid #29313c;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}header p{font-size:12px;color:#8d98a8;margin:4px 0 0}main{max-width:1100px;margin:auto;padding:12px}input,select,button{font:inherit}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #303947;background:#151b23;color:#fff}
.search-wrap{position:relative;z-index:2000}
#search{border-radius:24px;padding:14px 18px;font-size:15px;box-shadow:0 5px 18px #0005}
#suggestions{position:absolute;left:0;right:0;top:53px;background:#151b23;border:1px solid #303947;border-radius:0 0 16px 16px;overflow:hidden;display:none;box-shadow:0 12px 28px #0008;z-index:3000}
.suggestion{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:12px 16px;color:#fff;font-size:13px}
.suggestion:hover{background:#232c38}.toolbar{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr auto;gap:8px}button{border:1px solid #394352;background:#1a222d;color:#fff;border-radius:12px;padding:10px 13px;font-weight:700}#map{height:300px;border-radius:16px;margin:12px 0;border:1px solid #303947}.address-label{background:#10151c;color:#fff;border:1px solid #465365;border-radius:6px;padding:3px 5px;font-size:10px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{background:#151b23;border:1px solid #2b3440;border-radius:15px;padding:12px;min-width:0}.area{font-size:10px;color:#7fdaa8;text-transform:uppercase;font-weight:800;letter-spacing:.5px}h2{font-size:14px;line-height:1.35;margin:4px 0}.codes{display:grid;gap:6px;margin:11px 0}.code{background:#0b0f14;border-radius:9px;padding:9px;display:flex;justify-content:space-between;gap:6px;align-items:center}.label{font-size:10px;color:#8d98a8}.value{font-size:14px;font-weight:800;overflow-wrap:anywhere}.status{font-size:12px;color:#8d98a8;margin:9px 2px}.empty{grid-column:1/-1;text-align:center;color:#8d98a8;padding:30px}@media(max-width:500px){main{padding:9px}.cards{gap:7px}.card{padding:10px}.actions{grid-template-columns:1fr}#map{height:270px}}
</style>
</head>
<body>
<header><div><h1>Apartment Access</h1><p>Search · Codes · Map</p></div><button id="locate">⌖</button></header>
<main>
<div class="toolbar">
<div class="search-wrap"><input id="search" autocomplete="off" placeholder="Search address, suburb or code…"><div id="suggestions"></div></div>
<div class="row"><select id="sort"><option value="address">Sort: Address</option><option value="distance">Nearest first</option></select><button id="toggle">Hide map</button></div>
</div>
<div id="map"></div><div class="status" id="status">40 apartments loaded</div>
<section class="cards" id="cards"></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const APARTMENTS=[{"area": "Brunswick", "address": "10 Donald Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "2511"}]}, {"area": "Brunswick", "address": "10 Pottery Court, Brunswick VIC", "codes": [{"label": "Access code", "value": "6415"}]}, {"area": "Brunswick", "address": "100 Blyth Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "2789"}]}, {"area": "Brunswick", "address": "12-32 Lux Way, Brunswick VIC", "codes": [{"label": "Access code", "value": "Key2306"}]}, {"area": "Brunswick", "address": "15 Showers Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "#201001#"}]}, {"area": "Brunswick", "address": "2-6 Duckett Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "#2680#"}]}, {"area": "Brunswick", "address": "2 Black Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "Bell8116bell"}]}, {"area": "Brunswick", "address": "212 Albion Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "742579#"}]}, {"area": "Brunswick", "address": "285 Brunswick Road, Brunswick VIC", "codes": [{"label": "Access code", "value": "14580"}]}, {"area": "Brunswick", "address": "287 Brunswick Road, Brunswick VIC", "codes": [{"label": "Access code", "value": "#1206"}, {"label": "Access code", "value": "#2613"}]}, {"area": "Brunswick", "address": "394 Lygon Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "#3944#"}]}, {"area": "Brunswick", "address": "40-52 Percy Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "key0491"}]}, {"area": "Brunswick", "address": "4 Saxon Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "2608"}]}, {"area": "Brunswick", "address": "54-84 Percy Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "key9184"}]}, {"area": "Brunswick", "address": "55 De Carle Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "3579"}]}, {"area": "Brunswick", "address": "553 Murray Road, Brunswick VIC", "codes": [{"label": "Access code", "value": "5300"}]}, {"area": "Brunswick", "address": "6 Black Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "8047#"}]}, {"area": "Brunswick", "address": "690 High Street, Brunswick VIC", "codes": [{"label": "Phone icon", "value": "1937"}]}, {"area": "Brunswick", "address": "7 Colebrook Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "key2105"}]}, {"area": "Brunswick", "address": "74 De Carle Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "o,0852"}]}, {"area": "Brunswick", "address": "767 High Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "#2204"}]}, {"area": "Brunswick", "address": "8-38 Percy Street, Brunswick VIC", "codes": [{"label": "Access code", "value": "key2794"}]}, {"area": "Brunswick", "address": "98 Moreland Road, Brunswick VIC", "codes": [{"label": "Access code", "value": "C2389Z"}]}, {"area": "Brunswick East", "address": "116 Albert Street, Brunswick East VIC", "codes": [{"label": "Access code", "value": "#1874#"}]}, {"area": "Brunswick East", "address": "133 Nicholson Street, Brunswick East VIC", "codes": [{"label": "Access code", "value": "#1111"}]}, {"area": "Brunswick East", "address": "162-164 Lygon Street, Brunswick East VIC", "codes": [{"label": "Access code", "value": "483164"}]}, {"area": "Brunswick East", "address": "240-250 Lygon Street, Brunswick East VIC", "codes": [{"label": "Access code", "value": "#888888#"}]}, {"area": "Brunswick East", "address": "269 Stewart Street, Brunswick East VIC", "codes": [{"label": "Access code", "value": "#269269"}]}, {"area": "Brunswick East", "address": "38 Hutchinson Street, Brunswick East VIC", "codes": [{"label": "Access code", "value": "22106"}]}, {"area": "Brunswick East", "address": "455 Lygon Street, Brunswick East VIC", "codes": [{"label": "Access code", "value": "#9648"}]}, {"area": "Brunswick East", "address": "791-793 Park Street, Brunswick East VIC", "codes": [{"label": "Access code", "value": "5690"}]}, {"area": "Brunswick East", "address": "9 Holmes Street, Brunswick East VIC", "codes": [{"label": "Access code", "value": "2580"}]}, {"area": "Brunswick West", "address": "14 Irvine Crescent, Brunswick West VIC", "codes": [{"label": "Access code", "value": "C289"}]}, {"area": "Coburg", "address": "15-17 De Carle Street, Coburg VIC", "codes": [{"label": "Access code", "value": "313313#"}]}, {"area": "Coburg", "address": "183 Moreland Road, Brunswick VIC", "codes": [{"label": "Access code", "value": "1956#"}]}, {"area": "Coburg", "address": "23 Baxter Street, Coburg VIC", "codes": [{"label": "Access code", "value": "C7625 sml gate"}]}, {"area": "Coburg", "address": "37-41 Munro Street, Coburg VIC", "codes": [{"label": "Access code", "value": "#3204"}]}, {"area": "Coburg", "address": "5 Industry Lane, Coburg VIC", "codes": [{"label": "Access code", "value": ".8503"}]}, {"area": "Coburg", "address": "56 Sydney Road, Coburg VIC", "codes": [{"label": "Access code", "value": "8895"}]}, {"area": "Coburg", "address": "6 Industry Lane, Coburg VIC", "codes": [{"label": "Access code", "value": ".8503"}]}];
let user=null,map=L.map('map').setView([-37.77,144.96],13),markers=L.layerGroup().addTo(map),visible=true;
let userMarker=null;
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const $=x=>document.getElementById(x);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dist(a,b,c,d){const R=6371,p=Math.PI/180,x=.5-Math.cos((c-a)*p)/2+Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;return 2*R*Math.asin(Math.sqrt(x))}
function updateSuggestions(){
  const q=$('search').value.trim().toLowerCase();
  const box=$('suggestions');
  if(!q){box.innerHTML='';box.style.display='none';return}
  const matches=APARTMENTS.filter(a=>(a.area+' '+a.address+' '+a.codes.map(c=>c.value).join(' ')).toLowerCase().includes(q)).slice(0,7);
  box.innerHTML=matches.map(a=>'<button class="suggestion" data-id="'+a.address.replace(/"/g,'&quot;')+'">⌕ <b>'+esc(a.address)+'</b><br><span style="color:#7fdaa8">'+esc(a.codes.map(c=>c.value).join(' · '))+'</span></button>').join('');
  box.style.display=matches.length?'block':'none';
  box.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{$('search').value=b.dataset.id;$('suggestions').style.display='none';render()});
}
function render(){let q=$('search').value.toLowerCase(),list=APARTMENTS.filter(a=>(a.area+' '+a.address+' '+a.codes.map(c=>c.value).join(' ')).toLowerCase().includes(q));if($('sort').value==='distance')list.sort((a,b)=>(a.distance??99999)-(b.distance??99999));else list.sort((a,b)=>a.address.localeCompare(b.address));$('cards').innerHTML='';if(!list.length){$('cards').innerHTML='<div class="empty">No results</div>';return}list.forEach(a=>{let card=document.createElement('article');card.className='card';card.innerHTML='<div class="area">'+esc(a.area)+'</div><h2>'+esc(a.address)+'</h2>'+(a.distance!=null?'<div class="label">'+a.distance.toFixed(1)+' km away</div>':'')+'<div class="codes">'+a.codes.map(c=>'<div class="code"><span class="label">'+esc(c.label)+'</span><span class="value">'+esc(c.value)+'</span></div>').join('')+'</div>';card.querySelector('button').onclick=()=>open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a.address),'_blank');$('cards').appendChild(card)})}
async function geocode(){for(let a of APARTMENTS){try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=au&q='+encodeURIComponent(a.address));let d=await r.json();if(d[0]){a.lat=+d[0].lat;a.lng=+d[0].lon}await new Promise(r=>setTimeout(r,900))}catch(e){}}draw();render()}
function draw(){
  markers.clearLayers();
  const bounds=[];
  APARTMENTS.filter(a=>a.lat).forEach(a=>{
    const codeHtml=a.codes.map(c=>'<div><b>'+esc(c.label)+':</b> '+esc(c.value)+'</div>').join('');
    const popup='<div style="min-width:180px"><b>'+esc(a.address)+'</b>'+codeHtml+'</div>';
    const marker=L.marker([a.lat,a.lng]).addTo(markers).bindPopup(popup);
    marker.bindTooltip(esc(a.address.split(',')[0])+' · '+esc(a.codes.map(c=>c.value).join(' / ')),{permanent:true,direction:'top',offset:[0,-8],className:'address-label'});
    bounds.push([a.lat,a.lng]);
  });
  if(bounds.length && !user) map.fitBounds(bounds,{padding:[25,25]});
}
function enableLocation(){
  if(!navigator.geolocation){$('status').textContent='Location is not supported';return}
  $('status').textContent='Getting your current location…';
  navigator.geolocation.getCurrentPosition(p=>{
    user={lat:p.coords.latitude,lng:p.coords.longitude};
    APARTMENTS.forEach(a=>a.distance=a.lat?dist(user.lat,user.lng,a.lat,a.lng):null);
    $('sort').value='distance';
    map.setView([user.lat,user.lng],14);
    if(userMarker) map.removeLayer(userMarker);
    userMarker=L.circleMarker([user.lat,user.lng],{radius:8}).addTo(map).bindPopup('You are here');
    draw();render();
    $('status').textContent='Showing nearest apartments first';
  },()=>{$('status').textContent='Location permission denied. Tap ⌖ to try again';render()},{enableHighAccuracy:true,timeout:10000});
}
$('locate').onclick=enableLocation;
render();geocode().then(enableLocation);
</script>
</body></html>
