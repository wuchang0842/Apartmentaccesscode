<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101729"><title>Apartment Access Codes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.hero{background:#101729;color:#fff;padding:28px 26px 26px}h1{font-size:27px;margin:0 0 12px;letter-spacing:-.7px}.sub{color:#bfc6d4;margin:0 0 24px;font-size:15px}
.actions{display:grid;grid-template-columns:1fr 120px;gap:12px}button{font:inherit;cursor:pointer}.actions button{border:0;border-radius:17px;padding:16px 10px;font-weight:800;font-size:16px}#locate{background:#fff;color:#172033}#toggleMap{background:#344056;color:#fff}
main{max-width:1100px;margin:auto;padding:32px 20px}.notice{background:#fff7eb;color:#98482e;border-radius:18px;padding:18px;margin-bottom:14px;line-height:1.35}
.searchWrap{position:relative;z-index:5000}#search{width:100%;padding:17px 19px;border:2px solid #dedfe3;border-radius:19px;background:#fff;font-size:19px;outline:none}#search:focus{border-color:#8da7df}
#suggestions{display:none;position:absolute;left:0;right:0;top:62px;background:#fff;border:1px solid #dfe2e8;border-radius:0 0 18px 18px;overflow:hidden;box-shadow:0 12px 30px #17203324}.suggestion{display:block;width:100%;padding:13px 16px;text-align:left;border:0;border-bottom:1px solid #edf0f4;background:#fff;color:#172033;font-size:14px}.suggestion small{display:block;color:#267448;font-weight:800;margin-top:4px}
.summary{color:#687080;font-size:20px;margin:27px 3px 22px}#map{height:430px;border-radius:20px;overflow:hidden;border:1px solid #d9dde5;position:relative;z-index:1}.mapnote{font-size:12px;color:#7a8290;margin:9px 2px 22px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #e1e4ea;border-radius:16px;padding:14px;box-shadow:0 2px 6px #1720330a}.group{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:#6e8a75;margin-bottom:5px}.address{font-size:14px;font-weight:800;line-height:1.35;margin:0}.code{display:inline-block;background:#edf7ef;color:#22643c;border-radius:9px;padding:7px 9px;font-size:13px;font-weight:800;margin-top:10px;overflow-wrap:anywhere}.distance{font-size:12px;color:#7a8290;margin-top:9px}.empty{grid-column:1/-1;text-align:center;background:#fff;padding:30px;border-radius:16px;color:#7a8290}
.leaflet-tooltip.addressLabel{background:#10151c;color:#fff;border:1px solid #465365;border-radius:6px;padding:3px 5px;font-size:10px;font-weight:700;box-shadow:0 2px 8px #0008}
@media(max-width:600px){.hero{padding:30px 26px 26px}main{padding:32px 20px}#map{height:430px}.cards{gap:9px}.card{padding:12px}.address{font-size:13px}.code{font-size:12px;padding:6px 7px}}
</style></head>
<body>
<header class="hero"><h1>🏢 Apartment Access Codes</h1><p class="sub">Search addresses or codes · nearby apartments first</p>
<div class="actions"><button id="locate">📍 Find nearby</button><button id="toggleMap">🗺️ Map</button></div></header>
<main><div class="notice">Access codes are sensitive. Share this page only with trusted colleagues.</div>
<div class="searchWrap"><input id="search" type="search" autocomplete="off" placeholder="Search address or code…"><div id="suggestions"></div></div>
<div class="summary"><span id="count">40</span> apartments</div><div id="map"></div><div class="mapnote" id="status">Checking exact address locations…</div>
<section class="cards" id="cards"></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const APARTMENTS=[{"group": "Brunswick", "address": "10 Donald Street, Brunswick VIC", "code": "2511"}, {"group": "Brunswick", "address": "10 Pottery Court, Brunswick VIC", "code": "6415"}, {"group": "Brunswick", "address": "100 Blyth Street, Brunswick VIC", "code": "2789"}, {"group": "Brunswick", "address": "12-32 Lux Way, Brunswick VIC", "code": "Key2306"}, {"group": "Brunswick", "address": "2-6 Duckett Street, Brunswick VIC", "code": "#2680#"}, {"group": "Brunswick", "address": "2 Black Street, Brunswick VIC", "code": "Bell8116bell"}, {"group": "Brunswick", "address": "212 Albion Street, Brunswick VIC", "code": "742579#"}, {"group": "Brunswick", "address": "285 Brunswick Road, Brunswick VIC", "code": "14580"}, {"group": "Brunswick", "address": "287 Brunswick Road, Brunswick VIC", "code": "#1206 #2613"}, {"group": "Brunswick", "address": "40-52 Percy Street, Brunswick VIC", "code": "key0491"}, {"group": "Brunswick", "address": "4 Saxon Street, Brunswick VIC", "code": "2608"}, {"group": "Brunswick", "address": "54-84 Percy Street, Brunswick VIC", "code": "key9184"}, {"group": "Brunswick", "address": "55 De Carle Street, Brunswick VIC", "code": "3579"}, {"group": "Brunswick", "address": "6 Black Street, Brunswick VIC", "code": "8047#"}, {"group": "Brunswick", "address": "7 Colebrook Street, Brunswick VIC", "code": "key2105"}, {"group": "Brunswick", "address": "74 De Carle Street, Brunswick VIC", "code": "o,0852"}, {"group": "Thornbury", "address": "767 High Street, Thornbury VIC", "code": "#2204"}, {"group": "Brunswick", "address": "8-38 Percy Street, Brunswick VIC", "code": "key2794"}, {"group": "Brunswick", "address": "98 Moreland Road, Brunswick VIC", "code": "C2389Z"}, {"group": "Brunswick East", "address": "116 Albert Street, Brunswick East VIC", "code": "#1874#"}, {"group": "Brunswick East", "address": "133 Nicholson Street, Brunswick East VIC", "code": "#1111"}, {"group": "Brunswick East", "address": "162-164 Lygon Street, Brunswick East VIC", "code": "483164"}, {"group": "Brunswick East", "address": "240-250 Lygon Street, Brunswick East VIC", "code": "#888888#"}, {"group": "Brunswick East", "address": "269 Stewart Street, Brunswick East VIC", "code": "#269269"}, {"group": "Brunswick East", "address": "38 Hutchinson Street, Brunswick East VIC", "code": "22106"}, {"group": "Brunswick East", "address": "394 Lygon Street, Brunswick East VIC", "code": "#3944#"}, {"group": "Brunswick East", "address": "455 Lygon Street, Brunswick East VIC", "code": "#9648"}, {"group": "Brunswick East", "address": "791-793 Park Street, Brunswick East VIC", "code": "5690"}, {"group": "Brunswick East", "address": "9 Holmes Street, Brunswick East VIC", "code": "2580"}, {"group": "Brunswick West", "address": "14 Irvine Crescent, Brunswick West VIC", "code": "C289"}, {"group": "Coburg", "address": "15-17 De Carle Street, Coburg VIC", "code": "313313#"}, {"group": "Brunswick", "address": "183 Moreland Road, Brunswick VIC", "code": "1956#"}, {"group": "Coburg", "address": "23 Baxter Street, Coburg VIC", "code": "C7625 sml gate"}, {"group": "Coburg", "address": "37-41 Munro Street, Coburg VIC", "code": "#3204"}, {"group": "Coburg", "address": "5 Industry Lane, Coburg VIC", "code": ".8503"}, {"group": "Coburg", "address": "56 Sydney Road, Coburg VIC", "code": "8895"}, {"group": "Coburg", "address": "6 Industry Lane, Coburg VIC", "code": ".8503"}, {"group": "Needs checking", "address": "553 Murray Road, Preston VIC", "code": "5300"}, {"group": "Needs checking", "address": "690 High Street, Thornbury VIC", "code": "1937"}, {"group": "Needs checking", "address": "15 Showers Street, Preston VIC", "code": "#201001#"}];
let user=null, mapShown=true, userMarker=null;
const map=L.map('map').setView([-37.765,144.965],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const markers=L.layerGroup().addTo(map), $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dist=(a,b,c,d)=>{const R=6371,p=Math.PI/180,x=.5-Math.cos((c-a)*p)/2+Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;return 2*R*Math.asin(Math.sqrt(x))};
const fmt=k=>k==null?'':k<1?Math.round(k*1000)+' m':k.toFixed(1)+' km';
const text=a=>(a.address+' '+a.group+' '+a.code).toLowerCase();
function render(){
 let q=$('search').value.trim().toLowerCase(), list=APARTMENTS.filter(a=>text(a).includes(q));
 if(user)list.sort((a,b)=>(a.distance??99999)-(b.distance??99999));
 $('count').textContent=list.length;
 $('cards').innerHTML=list.length?list.map(a=>`<article class="card" data-id="${esc(a.address)}"><div class="group">${esc(a.group)}</div><h2 class="address">${esc(a.address)}</h2><span class="code">${esc(a.code)}</span>${a.distance!=null?`<div class="distance">${fmt(a.distance)} away</div>`:''}</article>`).join(''):'<div class="empty">No matching apartments found.</div>';
 $('cards').querySelectorAll('.card').forEach(c=>c.onclick=()=>focus(c.dataset.id));
}
function popup(a){return `<b>${esc(a.address)}</b><div style="color:#267448;font-weight:800;margin-top:5px">${esc(a.code)}</div>`}
function draw(){
 markers.clearLayers();const bounds=[];
 APARTMENTS.forEach(a=>{
  if(typeof a.lat!=='number'||typeof a.lng!=='number')return;
  const m=L.marker([a.lat,a.lng]).addTo(markers).bindPopup(popup(a));m._apt=a;
  m.bindTooltip(`${esc(a.address.split(',')[0])} · ${esc(a.code)}`,{permanent:true,direction:'top',offset:[0,-8],className:'addressLabel'});
  bounds.push([a.lat,a.lng]);
 });
 if(bounds.length&&!user)map.fitBounds(bounds,{padding:[20,20]});
}
function focus(address){const a=APARTMENTS.find(x=>x.address===address);if(!a||a.lat==null)return;map.setView([a.lat,a.lng],16);markers.eachLayer(m=>{if(m._apt===a)m.openPopup()})}
function suggest(){
 const q=$('search').value.trim().toLowerCase(),box=$('suggestions');
 if(!q){box.style.display='none';return}
 const list=APARTMENTS.filter(a=>text(a).includes(q)).slice(0,8);
 box.innerHTML=list.map(a=>`<button class="suggestion" data-address="${esc(a.address)}">${esc(a.address)}<small>${esc(a.code)}</small></button>`).join('');
 box.style.display=list.length?'block':'none';
 box.querySelectorAll('button').forEach(b=>b.onclick=()=>{$('search').value=b.dataset.address;box.style.display='none';render();focus(b.dataset.address)});
}
async function geocodeAll(){
 let ok=0;
 for(const a of APARTMENTS){
  try{
   const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=3&countrycodes=au&addressdetails=1&q='+encodeURIComponent(a.address),{headers:{'Accept-Language':'en'}});
   const d=await r.json();
   if(d[0]){a.lat=Number(d[0].lat);a.lng=Number(d[0].lon);ok++;draw();}
   await new Promise(r=>setTimeout(r,1100));
  }catch(e){console.warn(e);break}
 }
 $('status').textContent=ok+' exact map locations loaded. Tap a marker to see its code.';
}
function locate(){
 if(!navigator.geolocation)return alert('Location is not supported.');
 $('locate').textContent='📍 Locating…';
 navigator.geolocation.getCurrentPosition(p=>{
  user={lat:p.coords.latitude,lng:p.coords.longitude};
  APARTMENTS.forEach(a=>a.distance=typeof a.lat==='number'?dist(user.lat,user.lng,a.lat,a.lng):null);
  if(userMarker)map.removeLayer(userMarker);
  userMarker=L.circleMarker([user.lat,user.lng],{radius:9,color:'#1769d1',fillColor:'#3b91ff',fillOpacity:.9}).addTo(map).bindPopup('You are here');
  map.setView([user.lat,user.lng],14);render();$('locate').textContent='📍 Nearby first';
 },()=>{ $('locate').textContent='📍 Find nearby';alert('Please allow location access.')},{enableHighAccuracy:true,timeout:10000});
}
$('search').oninput=()=>{suggest();render()};$('search').onfocus=suggest;
document.addEventListener('click',e=>{if(!e.target.closest('.searchWrap'))$('suggestions').style.display='none'});
$('locate').onclick=locate;$('toggleMap').onclick=()=>{mapShown=!mapShown;$('map').style.display=mapShown?'block':'none';if(mapShown)setTimeout(()=>map.invalidateSize(),100)};
render();draw();geocodeAll();
</script></body></html>
